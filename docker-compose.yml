services:
  # Entorno de desarrollo
  web-dev:
    build:
      context: .
      target: development
    container_name: project-sims-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_PROXY_API_TARGET=http://project_sims_app:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - app-network
      - backend-network

volumes:
  node_modules:

networks:
  app-network:
    driver: bridge
  backend-network:
    external: true
    name: project-sims-backend_default
