name: Deploy Front
on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Prepare remote folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          script: |
            # Creem la carpeta si no existeix
            mkdir -p /var/www/sims-front/dist
            # Intentem netejar el contingut. Si falla per permisos, no aturarem el procés
            find /var/www/sims-front/dist -mindepth 1 -delete || true

      - name: Upload Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 1303
          source: "dist/*"
          target: "/var/www/sims-front/dist"
          strip_components: 1

      - name: Final Touch
        run: echo "Desplegament finalitzat correctament. Nginx servirà els nous fitxers automàticament."